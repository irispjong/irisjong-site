{{ $current := .Section }}
{{ if .IsHome }}{{ $current = "zines" }}{{ end }}
<header class="site-header">
  <a class="wordmark" href="{{ "/" | relURL }}">Iris Jong</a>
  <nav class="site-nav">
    {{ range $i, $item := .Site.Menus.main }}{{ if $i }}<span class="sep">/</span>{{ end }}<a href="{{ $item.URL }}"{{ if eq $item.Identifier $current }} class="is-current"{{ end }}>{{ $item.Name }}</a>{{ end }}
  </nav>
</header>
